[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-decision"
version = "1.0.0"
description = "Typed local decisions and permission-gated tool orchestration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "numpy>=1.24",
  "pydantic>=2.0",
  "tokenizers>=0.15",
  "torch>=2.1",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8.0"]

[project.scripts]
apex-decision = "apex_decision.api.server:start_server"

[tool.setuptools.packages.find]
include = ["apex_decision*", "apex_classifier_750m*"]

[tool.setuptools.package-data]
apex_decision = ["models/apex_student/scaling_checkpoints/*.pt", "models/apex_student/tokenizer_weights/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
